<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PORT SOLANA: Neon Harbor</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241426; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #minimap { position: fixed; top: 12px; right: 12px; width: 180px; height: 140px; display: block; border: 2px solid rgba(255,170,90,.55); border-radius: 6px; background: #141126; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Port Solana Neon Harbor: top-down open-world crime game"></canvas>
<canvas id="minimap" width="180" height="140" aria-label="Minimap"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
